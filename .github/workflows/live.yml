name: Jonli o'yinlar
on:
  schedule:
    # Har 6 soatda yangi "oyna" boshlanadi (05:00, 11:00, 17:00, 23:00 Toshkent vaqti)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kanalga yubormay, faqat logda ko'rsatish"
        type: boolean
        default: false
      hours:
        description: "Necha soat ishlasin"
        default: "5.9"
concurrency:
  group: live   # bir vaqtda faqat bitta jonli kuzatuv
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # yuborilgan voqealar ro'yxatini oynalar orasida saqlash
      - uses: actions/cache/restore@v4
        with:
          path: live_state.json
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-
      - run: python main.py live --hours ${{ inputs.hours || '5.9' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PYTHONUNBUFFERED: "1"
          LIVE_YELLOW_CARDS: ${{ vars.LIVE_YELLOW_CARDS }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: live_state.json
          key: live-state-${{ github.run_id }}
